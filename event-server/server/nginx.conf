server {
    listen 80;
    listen [::]:80;
    server_name 317mx.duckdns.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/317mx-acme; }
    location / { return 301 https://317mx.duckdns.org$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 317mx.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/317mx.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/317mx.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/317mx;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /downloads/317MX-11-Track-Rotation-2026-10-31.zip {
        limit_except GET { deny all; }
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="317MX-11-Track-Rotation-2026-10-31.zip"' always;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options nosniff always;
        max_ranges 1;
        gzip off;
        try_files $uri =404;
    }

    location /api/events {
        client_max_body_size 2k;
        proxy_pass http://127.0.0.1:8767;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /api/status {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8766/api/status;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_set_header Connection "";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /api/records {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8766/api/records;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_set_header Connection "";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /api/servers {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8766/api/servers;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_set_header Connection "";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { deny all; }
    location ~* \.(?:html|js|css)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ =404; }
}


